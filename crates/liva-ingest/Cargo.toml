[package]
name = "liva-ingest"
version = "0.1.0"
edition = "2021"
authors = ["LIVA Banking Core Team"]
description = "Statement ingestion engine for Vietnamese banks, CAMT.053, and SWIFT MT940"
license = "Proprietary"

[lints]
workspace = true

[dependencies]
liva-money = { path = "../liva-money" }
liva-normalize = { path = "../liva-normalize" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
calamine = "0.26"
csv = "1.3"
lopdf = "0.32"
quick-xml = "0.31"
encoding_rs = "0.8"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
