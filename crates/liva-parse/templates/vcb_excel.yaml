name: "Vietcombank Corporate Excel Statement Template"
version: "1.0.0"
bank_code: "VCB"
bank_name: "Ngân hàng TMCP Ngoại thương Việt Nam"
currency: "VND"
description: "Handles merged cell forward-fills and Vietnamese dot thousand separators."

sniffing:
  container:
    allowed_formats: ["ExcelZip", "ExcelOle"]
    file_extensions: [".xlsx", ".xls"]
    magic_bytes: ["504B0304", "D0CF11E0"]
  content_rules:
    min_score: 15
    rules:
      - pattern: "(?i)vietcombank|ngoại thương|vcb"
        target: "header_text"
        score: 10
      - pattern: "(?i)số tài khoản|account no"
        target: "header_text"
        score: 5
      - pattern: "(?i)sao kê tài khoản|statement of account"
        target: "header_text"
        score: 5
      - pattern: "(?i)vcb"
        target: "filename"
        score: 10

container_options:
  excel:
    sheet_selection: "first"
    merged_cells: "forward_fill"

metadata:
  scan_range:
    header_rows: 25
    footer_rows: 30
  fields:
    account_number:
      extractor: "regex"
      patterns:
        - "(?i)(?:số tài khoản|account no)[\\s:/-]+([0-9]{9,16})"
      keywords: ["số tài khoản", "account no"]
    account_name:
      extractor: "key_value"
      keywords: ["tên tài khoản", "account name"]
    opening_balance:
      extractor: "key_value"
      keywords: ["số dư đầu kỳ", "opening balance"]
    closing_balance:
      extractor: "key_value"
      keywords: ["số dư cuối kỳ", "closing balance"]

table:
  header_detection:
    detection_mode: "keyword_match"
    min_matching_columns: 3
    stop_at_row: 30
  columns:
    date:
      aliases: ["ngày giao dịch", "ngày gd", "date"]
      required: true
    value_date:
      aliases: ["ngày giá trị", "value date", "ngày hl"]
      required: false
    ref_code:
      aliases: ["chứng từ", "tham chiếu", "ref", "mã gd", "số bút toán"]
      required: false
      fallback_from_narration_regex:
        - "\\b(FT[0-9A-Z]{8,18})\\b"
        - "\\b(NPS[0-9A-Z]{8,18})\\b"
        - "\\b(VN[0-9A-Z]{8,18})\\b"
        - "\\b(VCB[0-9A-Z]{6,16})\\b"
    amount_mode: "separate_debit_credit"
    debit:
      aliases: ["ghi nợ", "nợ", "debit"]
    credit:
      aliases: ["ghi có", "có", "credit"]
    balance_after:
      aliases: ["số dư", "balance"]
      required: false
    narration:
      aliases: ["nội dung", "diễn giải", "narration", "description"]
      required: true
    counterparty_name:
      aliases: ["đối tác", "đối ứng", "counterparty"]
  row_filters:
    ignore_empty_rows: true
    skip_if_date_missing: true
    stop_conditions:
      - "(?i)^tổng"
      - "(?i)^total"
      - "(?i)^số dư cuối kỳ"
  continuation_lines:
    enabled: true
    append_to: "narration"
    delimiter: " "
    condition: "date_is_empty_and_no_amount"

formatting:
  date:
    formats:
      - "%d/%m/%Y %H:%M:%S"
      - "%d/%m/%Y"
      - "%Y-%m-%d %H:%M:%S"
      - "%Y-%m-%d"
  number:
    thousand_separator: "."
    decimal_separator: ","
    decimal_places: 0
    negative_format: "both"
    strip_tokens: ["VND", "VNĐ", "đ"]

invariants:
  verification_formula: "closing_eq_opening_plus_credit_minus_debit"
  policy: "strict"
  allow_missing_balances: true
  tolerance_minor_units: 0
