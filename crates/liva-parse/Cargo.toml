[package]
name = "liva-parse"
version = "0.2.0"
edition = "2021"
authors = ["LIVA Banking Core Team"]
description = "Canonical Transaction Schema, Statement Template DSL, and multi-bank parser engine"
license = "Proprietary"
publish = false

[dependencies]
liva-money = { path = "../liva-money" }
liva-ledger = { path = "../liva-ledger" }
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "1.0"
csv = "1.3"
calamine = "0.36"
regex = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
