[package]
name = "liva-audit"
version = "0.1.0"
edition = "2021"
authors = ["LIVA Banking Core Team"]
description = "RFC 6962 Binary Merkle Tree and HMAC-SHA256 tamper-evident audit ledger for LIVA Banking"
license = "Proprietary"

[lints]
workspace = true

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
rand = "0.8"
rusqlite = { version = "0.31.0", features = ["bundled"] }
