[package]
name = "liva-server"
version = "0.1.0"
edition = "2021"
authors = ["LIVA Banking Core Team"]
description = "High-performance On-Premise Client-Server Backend for LIVA Banking Harness"
publish = false

[lints]
workspace = true

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "timeout", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
liva-core = { path = "../../crates/liva-core" }
liva-money = { path = "../../crates/liva-money" }
liva-ledger = { path = "../../crates/liva-ledger" }
liva-audit = { path = "../../crates/liva-audit" }
liva-normalize = { path = "../../crates/liva-normalize" }
liva-ingest = { path = "../../crates/liva-ingest" }
liva-match = { path = "../../crates/liva-match" }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3"
